# dsh-multimedia bundle patch: host row (mounts /multimedia API + agent tools
# media_generate / media_list / media_status / media_export, and the
# '多媒体' conversation tab via dsh.client).
#
# Install:  dsh plugin --profile web add link:/Users/echerlos/syncthing/project/dsplugins/dsh-multimedia
# Requires dsh web restart (host code). Client bundle edits: rebuild + refresh.
#
# 渠道配置说明（v0.1）：
# - 种子渠道写在这里；运行时渠道设置（页面「渠道设置」区）写入
#   dataDir/channels.json，运行时值优先于本行（仅覆盖已存在渠道的字段，
#   apiKey 留空表示不改）。
# - API Key 一律走环境变量（apiKeyEnv），页面输入框填了 key 也只在内存/
#   channels.json 中保存，绝不写进本文件。
- insert:
    - id: multimedia
      name: dsh-multimedia
      inject: [timer, webServer, tools]
      config:
        dataDir: '~/.dsh/multimedia'
        # 渠道种子：页面可增删/启停/改名。apiKeyEnv 优先，其次 apiKey 字面量。
        channels:
          - id: fal
            type: fal
            label: fal.ai
            enabled: false
            apiKeyEnv: FAL_KEY
            apiKey: ''
            baseUrl: 'https://queue.fal.run'
          - id: elevenlabs
            type: elevenlabs
            label: ElevenLabs
            enabled: false
            apiKeyEnv: ELEVENLABS_API_KEY
            apiKey: ''
            baseUrl: 'https://api.elevenlabs.io/v1'
          - id: comfyui
            type: comfyui
            label: ComfyUI (本地)
            enabled: false
            apiKeyEnv: ''
            apiKey: ''
            baseUrl: 'http://127.0.0.1:8188'
          # ── 免费渠道（无需 API Key，开箱即用） ─────────────────────────────
          - id: pollinations
            type: pollinations
            label: Pollinations（免费）
            enabled: true
            apiKeyEnv: ''
            apiKey: ''
            baseUrl: 'https://image.pollinations.ai'
          - id: googletts
            type: googletts
            label: Google TTS（免费）
            enabled: true
            apiKeyEnv: ''
            apiKey: ''
            baseUrl: 'https://translate.google.com'
          # Cloudflare Workers AI：免费层 10k neurons/天；需 CF_API_TOKEN + extra.accountId
          - id: cloudflare
            type: cloudflare
            label: Cloudflare Workers AI
            enabled: false
            apiKeyEnv: CF_API_TOKEN
            apiKey: ''
            baseUrl: 'https://api.cloudflare.com/client/v4'
            extra:
              accountId: ''
          # xAI (Grok Imagine)：图片生成/编辑 + 视频生成/编辑/扩展（异步轮询）；
          # 需 XAI_API_KEY（https://console.x.ai）。编辑/扩展由 agent 工具
          # media_generate 的 params.action=edit|extend + params.image/video 输入驱动。
          - id: xai
            type: xai
            label: xAI (Grok Imagine)
            enabled: false
            apiKeyEnv: XAI_API_KEY
            apiKey: ''
            baseUrl: 'https://api.x.ai/v1'
          # ZenMux：OpenAI 兼容聚合网关。图片（GPT Image 2，同步 b64）+ 视频
          # （原生异步协议 /videos，Seedance 2.0，支持图生视频 params.image）+ TTS
          # （Gemini Flash TTS，PCM 自动封装为 WAV）。需 ZENMUX_API_KEY
          # （https://zenmux.ai/platform/pay-as-you-go 充值并创建 Key）。
          # 更多模型 slug 见 https://zenmux.ai/models（「供应商/模型名」格式）。
          - id: zenmux
            type: zenmux
            label: ZenMux
            enabled: false
            apiKeyEnv: ZENMUX_API_KEY
            apiKey: ''
            baseUrl: 'https://zenmux.ai/api/v1'
